name: Bug report
description: Report a problem with H.I.L.D.A Multi List
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing H.I.L.D.A Multi List. Please include enough detail to reproduce the issue.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.x.x"
    validations:
      required: true
  - type: input
    id: hilda_version
    attributes:
      label: H.I.L.D.A version
      placeholder: "0.4.0-beta.1"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Home Assistant logs / browser console output
      render: text
